  # ==================== Notion ====================
  /notion/oauth/start:
    get:
      tags: [Notion]
      summary: 创建 Notion OAuth 授权地址
      description: |
        需登录。服务端生成一次性、用户绑定的 state（10 分钟有效）并返回授权地址；前端应直接跳转。
        浏览器不接收 Notion access token，且请求不能指定 redirect URI。
      operationId: startNotionOAuth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotionOAuthStartResponse'
        "401":
          description: 未登录或用户不可用
        "400":
          description: Notion 未配置（稳定业务码 40017）

  /notion/oauth/callback:
    get:
      tags: [Notion]
      summary: Notion OAuth 服务端回调
      description: |
        由 Notion 重定向调用，不携带 Bearer token。服务端原子消费 state，交换 code 后保存加密凭据，
        随即 302 跳转到固定的 NOTION_FRONTEND_REDIRECT_URL。成功时附加 `notion_oauth=success`；
        失败时附加 `notion_oauth=error&reason=<稳定枚举>`，不会透传第三方错误、OAuth code 或 token。
      operationId: handleNotionOAuthCallback
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Notion 仅在授权成功时提供的短期 authorization code；禁止记录或展示。
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: 服务端创建的一次性 state；缺失、过期或重复使用均失败。
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: 用户拒绝授权时由 Notion 返回的错误类别。
      responses:
        "302":
          description: |
            跳转到固定前端设置页。失败 reason 仅为 denied、invalid_state、expired_state、user_disabled、exchange_failed 或 not_configured。
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: 配置的前端设置页及安全的 OAuth 结果查询参数。

  /notion/bind:
    get:
      tags: [Notion]
      summary: 查询 Notion 连接状态
      operationId: getNotionBinding
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotionBindingStatusResponse'
    delete:
      tags: [Notion]
      summary: 解绑 Notion 工作区
      description: 删除当前用户的本地加密凭据；远端撤销采用尽力而为方式，不阻塞本地解绑。
      operationId: unbindNotion
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        nullable: true

  /notion/pages:
    get:
      tags: [Notion]
      summary: 分页浏览已授权的 Notion 页面
      description: 仅返回 OAuth 当前可访问的 page 对象；不返回完整 properties 或凭据。页面权限可能在实际导入时再次变化。
      operationId: listNotionPages
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 上一响应返回的不透明 next_cursor。
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotionPageListResponse'
        "400":
          description: 未配置（40017）、未连接（40018）或授权失效（40019）
        "429":
          description: Notion 请求受限（稳定业务码 40024）

  /notion/import/batch:
    post:
      tags: [Notion]
      summary: 手动批量导入 Notion 页面快照
      description: |
        最多 50 个页面。服务端校验当前用户对笔记本和页面的访问权限，创建 type=notion 的来源及可查询任务。
        这是一次性快照；不导入数据库、不会自动同步、不会写回 Notion，也不下载附件。
      operationId: importNotionPagesBatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotionImportBatchRequest'
      responses:
        "200":
          description: 任务已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotionImportBatchResponse'
        "400":
          description: 参数、连接或授权状态异常；内容处理失败使用稳定业务码 40025。
        "403":
          description: 当前用户不拥有 notebook_id。

  /notion/import/tasks/{taskId}:
    get:
      tags: [Notion]
      summary: 查询 Notion 导入任务
      operationId: getNotionImportTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotionTaskID'
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotionImportTaskResponse'
        "403":
          description: 任务不属于当前用户。
        "404":
          description: 任务不存在。
    delete:
      tags: [Notion]
      summary: 取消 Notion 导入任务
      description: 只取消当前用户的任务；已完成的来源不会回滚，尚未开始的来源进入 cancelled。
      operationId: cancelNotionImportTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotionTaskID'
      responses:
        "200":
          description: 已请求取消；任务最终状态可通过查询接口获取，取消消息使用稳定业务码 40026。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        nullable: true
        "403":
          description: 任务不属于当前用户。
        "404":
          description: 任务不存在。

  # ==================== Health ====================
  /health:
    get:
      summary: 健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: YouDaoNoteLM API is running
